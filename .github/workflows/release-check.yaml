name: Check for new releases

on:
  workflow_dispatch:
  schedule:
    # Once a day at 06:27 UTC.
    - cron: "27 6 * * *"

jobs:
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      UOS_VERSION: ${{ steps.version.outputs.UOS_VERSION }}
      UOS_DOWNLOAD_AMD64: ${{ steps.version.outputs.UOS_DOWNLOAD_AMD64 }}
      UOS_DOWNLOAD_ARM64: ${{ steps.version.outputs.UOS_DOWNLOAD_ARM64 }}
      RELEASED: ${{ steps.release.outputs.released }}

    steps:
      - name: Get latest version
        run: |
          curl -sX GET "https://fw-update.ubnt.com/api/firmware-latest?filter=eq~~product~~unifi-os-server&filter=eq~~platform~~linux-x64&filter=eq~~channel~~release" > linux-amd64.json
          curl -sX GET "https://fw-update.ubnt.com/api/firmware-latest?filter=eq~~product~~unifi-os-server&filter=eq~~platform~~linux-arm64&filter=eq~~channel~~release" > linux-arm64.json
          jq empty linux-amd64.json
          jq empty linux-arm64.json

      - name: Extract version and download urls
        id: version
        run: |
          if [ "$(jq '._embedded.firmware | length' linux-amd64.json)" -eq 0 ]; then
            echo "No firmware entries found" >&2
            exit 1
          fi

          UOS_VERSION=$(jq -r '._embedded.firmware[0].version // empty' linux-amd64.json | sed 's/^v//')
          UOS_DOWNLOAD_AMD64=$(jq -r '._embedded.firmware[0]._links.data.href // empty' linux-amd64.json)
          UOS_DOWNLOAD_ARM64=$(jq -r '._embedded.firmware[0]._links.data.href // empty' linux-arm64.json)

          if [ -z "$UOS_VERSION" ] || [ -z "$UOS_DOWNLOAD_AMD64" ] || [ -z "$UOS_DOWNLOAD_ARM64" ]; then
            echo "Missing version or download URL in JSON" >&2
            exit 1
          fi

          echo "UOS_VERSION=$UOS_VERSION" >> "$GITHUB_OUTPUT"
          echo "UOS_DOWNLOAD_AMD64=$UOS_DOWNLOAD_AMD64" >> "$GITHUB_OUTPUT"
          echo "UOS_DOWNLOAD_ARM64=$UOS_DOWNLOAD_ARM64" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check if this version is already released
        id: release
        env:
          UOS_VERSION: ${{ steps.version.outputs.UOS_VERSION }}
        run: |
          set -euo pipefail

          # Only skip if this version already landed on main. An open PR is
          # NOT a skip condition: re-running create-pr lets
          # create-pull-request reconcile (rebase) the existing branch onto
          # the latest main, so a stale PR gets refreshed instead of stuck.
          current=$(grep -oP 'APP_VERSION="\K[^"]+' Dockerfile)
          if [ "${current}" = "${UOS_VERSION}" ]; then
            echo "APP_VERSION ${UOS_VERSION} already on main!"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${UOS_VERSION} needs a PR (new, or existing PR to rebase)."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  create-pr:
    runs-on: ubuntu-24.04
    needs: release-check
    if: needs.release-check.outputs.RELEASED == 'false'
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A GitHub App token (not GITHUB_TOKEN) is required so that:
      #  1. the PR it opens triggers the container-test workflow
      #     (GITHUB_TOKEN-created PRs do not cascade pull_request events), and
      #  2. auto-merge can be enabled (GITHUB_TOKEN cannot enable it).
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Update Dockerfile and release metadata
        env:
          UOS_VERSION: ${{ needs.release-check.outputs.UOS_VERSION }}
          UOS_DOWNLOAD_AMD64: ${{ needs.release-check.outputs.UOS_DOWNLOAD_AMD64 }}
          UOS_DOWNLOAD_ARM64: ${{ needs.release-check.outputs.UOS_DOWNLOAD_ARM64 }}
        run: |
          set -euo pipefail
          chart=charts/unifi-os-server/Chart.yaml

          # Old UOS version (before bump) drives the chart semver delta.
          old_uos=$(grep -oP 'APP_VERSION="\K[^"]+' Dockerfile || true)
          if [ -z "$old_uos" ]; then
            echo "Could not read current APP_VERSION from Dockerfile" >&2
            exit 1
          fi

          sed -i "s/APP_VERSION=.*/APP_VERSION=\"$UOS_VERSION\"/" Dockerfile
          {
            echo "UOS_VERSION=$UOS_VERSION"
            echo "UOS_DOWNLOAD_AMD64=$UOS_DOWNLOAD_AMD64"
            echo "UOS_DOWNLOAD_ARM64=$UOS_DOWNLOAD_ARM64"
          } > .release-meta

          # Chart appVersion tracks the UOS firmware version verbatim.
          sed -i "s/^appVersion:.*/appVersion: \"$UOS_VERSION\"/" "$chart"

          # Chart version mirrors the UOS semver delta: bump the same level
          # (major/minor/patch) that changed upstream.
          cur_ver=$(grep -oP '^version:\s*\K\S+' "$chart")
          IFS=. read -r cmaj cmin cpat <<EOF
          $cur_ver
          EOF
          IFS=. read -r omaj omin _opat <<EOF
          $old_uos
          EOF
          IFS=. read -r nmaj nmin _npat <<EOF
          $UOS_VERSION
          EOF
          if [ "$nmaj" != "$omaj" ]; then
            new_ver="$((cmaj + 1)).0.0"
          elif [ "$nmin" != "$omin" ]; then
            new_ver="${cmaj}.$((cmin + 1)).0"
          else
            new_ver="${cmaj}.${cmin}.$((cpat + 1))"
          fi
          sed -i "s/^version:.*/version: $new_ver/" "$chart"
          echo "Chart version $cur_ver -> $new_ver (appVersion $UOS_VERSION)"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Update UniFi OS Server to ${{ needs.release-check.outputs.UOS_VERSION }}"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: updates-unifi-core-${{ needs.release-check.outputs.UOS_VERSION }}
          base: main
          add-paths: |
            Dockerfile
            .release-meta
            charts/unifi-os-server/Chart.yaml
          title: "Update UniFi OS Server to ${{ needs.release-check.outputs.UOS_VERSION }}"
          body: |
            Bump UniFi OS Server to `${{ needs.release-check.outputs.UOS_VERSION }}`.

            Merging this PR triggers the **Publish image** workflow, which builds
            and pushes the multiarch image for this version.

      - name: Enable auto-merge
        # Uses the App token: GITHUB_TOKEN cannot enable auto-merge. Rebase
        # keeps main linear with the single version-bump commit. Merges once
        # the required container boot-test checks pass (enforced by the
        # protect-main ruleset); no approval is required.
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --auto --rebase --repo "$GITHUB_REPOSITORY"
