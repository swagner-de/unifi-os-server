name: Publish chart

on:
  push:
    branches: [main]
    paths:
      - charts/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_DIR: charts/unifi-os-server

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.4

      - name: Lint chart
        run: helm lint "${CHART_DIR}"

      - name: Package chart
        id: package
        run: |
          set -euo pipefail
          helm package "${CHART_DIR}" -d dist
          pkg=$(ls dist/*.tgz)
          echo "path=${pkg}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login "${REGISTRY}" \
            --username "${{ github.actor }}" --password-stdin

      - name: Push chart
        # Publish under a dedicated `charts` namespace so the chart does not
        # share a package path with the OS server image, which lives at
        # ghcr.io/<owner>/unifi-os-server. The chart lands at
        # ghcr.io/<owner>/charts/unifi-os-server.
        run: |
          helm push "${{ steps.package.outputs.path }}" \
            "oci://${REGISTRY}/${{ github.repository_owner }}/charts"
